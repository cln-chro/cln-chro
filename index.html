<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="referrer" content="strict-origin">
<title>Shuffle</title>
<style>
  :root{
    --stage:#000; --panel:#141416; --panel-2:#1d1d21; --line:#31313a;
    --ink:#f4f2ee; --muted:#95949e; --lamp:#f0b429; --danger:#e06a5c; --like:#ff3b5c;
    --sans: ui-sans-serif, system-ui, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden;background:var(--stage);color:var(--ink);font-family:var(--sans)}
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
  button:focus-visible{outline:2px solid var(--lamp);outline-offset:2px}

  #gate{position:fixed;inset:0;display:grid;place-items:center;padding:28px;text-align:center;z-index:10}
  #gate .inner{max-width:32ch}
  #gate h1{font-size:26px;font-weight:600;letter-spacing:-.02em;line-height:1.15}
  #gate p{margin-top:12px;font-size:14px;line-height:1.6;color:var(--muted)}
  .primary{margin-top:22px;padding:13px 24px;border-radius:999px;background:var(--lamp);color:#15120a;font-weight:600;font-size:15px}
  .primary:active{transform:scale(.97)}
  .primary[disabled]{opacity:.5}
  #gate .err{margin-top:16px;font-size:13px;line-height:1.55;color:var(--danger)}

  #feed{height:100dvh;overflow-y:auto;scroll-snap-type:y mandatory;overscroll-behavior-y:contain;scrollbar-width:none;display:none}
  #feed.on{display:block}
  #feed::-webkit-scrollbar{display:none}
  .reel{position:relative;height:100dvh;scroll-snap-align:start;scroll-snap-stop:always;display:flex;align-items:center;justify-content:center;background:#000}
  .reel video{width:100%;height:100%;object-fit:contain;background:#000;display:block}
  .reel .shade{position:absolute;inset:auto 0 0 0;height:36%;background:linear-gradient(to top,rgba(0,0,0,.72),transparent);pointer-events:none}

  .load{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);font-size:13px;text-align:center;padding:24px}
  .load.hide{display:none}
  .load .bar{width:130px;height:3px;background:rgba(255,255,255,.14);border-radius:2px;overflow:hidden;margin:0 auto}
  .load .bar i{display:block;height:100%;width:0;background:var(--lamp);transition:width .15s linear}
  .load .pct{margin-top:9px;line-height:1.5}
  .load.err .bar{display:none}
  .load.err .pct{color:var(--danger);max-width:28ch}
  .load .retry{margin-top:12px;padding:8px 16px;border-radius:999px;background:var(--panel-2);border:1px solid var(--line);font-size:13px;display:none}
  .load.err .retry{display:inline-block}

  .meta{position:absolute;left:16px;right:88px;bottom:calc(12px + env(safe-area-inset-bottom));pointer-events:none}
  .catlab{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
          margin-bottom:5px;text-shadow:0 1px 10px rgba(0,0,0,.9)}
  .catlab[hidden]{display:none}
  .meta .name{font-size:15px;line-height:1.35;font-weight:500;letter-spacing:-.01em;text-shadow:0 1px 12px rgba(0,0,0,.85);word-break:break-word}

  .side{position:absolute;right:12px;bottom:calc(26px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:6px}
  .side button{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:rgba(18,18,20,.55);backdrop-filter:blur(8px)}
  .side button:active{transform:scale(.93)}
  .side svg{width:21px;height:21px;fill:none;stroke:var(--ink);stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

  .scrub{position:absolute;left:0;right:0;bottom:0;height:26px;display:flex;align-items:flex-end}
  .scrub .track{height:3px;width:100%;background:rgba(255,255,255,.16)}
  .scrub .fill{height:100%;width:0;background:var(--lamp)}

  .pausepip{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;opacity:0;transition:opacity .18s}
  .reel.paused .pausepip{opacity:1}
  .pausepip div{width:72px;height:72px;border-radius:50%;background:rgba(0,0,0,.45);display:grid;place-items:center}
  .pausepip svg{width:28px;height:28px;fill:var(--ink)}

  #top{position:fixed;top:0;left:0;right:0;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;display:none;align-items:center;gap:10px;z-index:5;
       background:linear-gradient(to bottom,rgba(0,0,0,.55),transparent);pointer-events:none}
  #top.on{display:flex}
  #top > *{pointer-events:auto}
  #pos{font-size:12px;color:var(--muted);text-shadow:0 1px 10px #000;cursor:pointer;padding:4px 2px}
  .chip{margin-left:auto;padding:7px 13px;border-radius:999px;background:rgba(18,18,20,.6);backdrop-filter:blur(8px);font-size:13px;font-weight:500}

  /* like button — one fixed control, just under the top-bar chips */
  #like{position:fixed;right:14px;top:calc(env(safe-area-inset-top) + 58px);z-index:6;
        width:42px;height:42px;border-radius:50%;display:none;place-items:center;
        background:rgba(18,18,20,.55);backdrop-filter:blur(8px)}
  #like.on{display:grid}
  #like:active{transform:scale(.92)}
  #like svg{width:20px;height:20px;fill:none;stroke:var(--ink);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  #like.has svg{fill:var(--like);stroke:var(--like)}
  #like.pop{animation:pop .3s ease}
  @keyframes pop{0%{transform:scale(1)}45%{transform:scale(1.22)}100%{transform:scale(1)}}
  /* top-ten trophy */
  #rank{position:fixed;right:14px;top:calc(env(safe-area-inset-top) + 108px);z-index:6;
        height:32px;padding:0 10px 0 8px;border-radius:999px;display:none;align-items:center;gap:5px;
        backdrop-filter:blur(8px);--m:#9aa0ad;
        background:rgba(154,160,173,.18);border:1px solid rgba(154,160,173,.5)}
  #rank.on{display:flex}
  #rank.r1{--m:#f0b429;background:rgba(240,180,41,.18);border-color:rgba(240,180,41,.55)}   /* gold   */
  #rank.r2{--m:#ccd2dc;background:rgba(204,210,220,.18);border-color:rgba(204,210,220,.55)} /* silver */
  #rank.r3{--m:#cd8440;background:rgba(205,132,64,.20);border-color:rgba(205,132,64,.6)}    /* bronze */
  #rank svg{width:15px;height:15px;fill:none;stroke:var(--m);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  #rank b{font-size:13px;font-weight:700;color:var(--m);letter-spacing:.01em}

  /* category trophy — same medals, a touch smaller so the two read apart */
  #crank{position:fixed;left:14px;top:calc(env(safe-area-inset-top) + 42px);z-index:6;
         height:27px;padding:0 9px 0 7px;border-radius:999px;display:none;align-items:center;gap:4px;
         backdrop-filter:blur(8px);--m:#9aa0ad;
         background:rgba(154,160,173,.14);border:1px solid rgba(154,160,173,.42)}
  #crank.on{display:flex}
  #crank.r1{--m:#f0b429;background:rgba(240,180,41,.15);border-color:rgba(240,180,41,.5)}
  #crank.r2{--m:#ccd2dc;background:rgba(204,210,220,.15);border-color:rgba(204,210,220,.5)}
  #crank.r3{--m:#cd8440;background:rgba(205,132,64,.17);border-color:rgba(205,132,64,.55)}
  #crank svg{width:13px;height:13px;fill:none;stroke:var(--m);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  #crank b{font-size:12px;font-weight:700;color:var(--m)}
  #crank .sep{width:1px;height:14px;background:currentColor;opacity:.28;margin:0 2px}
  #crank svg.h{width:12px;height:12px;fill:var(--like);stroke:var(--like);stroke-width:1.4}
  #crank i{font-size:12px;font-weight:700;font-style:normal;color:var(--ink)}

  #likeCnt{position:absolute;bottom:-2px;right:-2px;min-width:18px;height:18px;padding:0 5px;
           border-radius:9px;background:var(--like);color:#fff;font-size:11px;font-weight:700;
           line-height:18px;text-align:center;display:none}
  #like.has #likeCnt{display:block}

  /* leaderboard */
  #board{position:fixed;inset:0;z-index:25;display:none;background:rgba(0,0,0,.72)}
  #board.show{display:block}
  #boardPanel{position:absolute;left:0;right:0;bottom:0;max-height:82dvh;display:flex;flex-direction:column;
              background:var(--panel);border-radius:18px 18px 0 0;border-top:1px solid var(--line);
              padding-bottom:env(safe-area-inset-bottom)}
  #boardPanel h2{font-size:16px;font-weight:600;letter-spacing:-.01em}
  .boardHead{display:flex;align-items:center;gap:12px;padding:16px 16px 12px;border-bottom:1px solid var(--line)}
  .boardHead .close{margin-left:auto;font-size:14px;color:var(--muted)}
  #rows{overflow-y:auto;padding:8px 0 14px}
  .brow{display:flex;align-items:center;gap:11px;padding:8px 16px}
  .brow .rank{width:22px;text-align:center;font-size:14px;font-weight:600;color:var(--muted);flex:none}
  .brow:nth-child(1) .rank{color:#f0b429}
  .brow:nth-child(2) .rank{color:#c3c7cf}
  .brow:nth-child(3) .rank{color:#c98a52}
  .brow .av{width:38px;height:38px;border-radius:50%;flex:none}
  .brow .barwrap{flex:1;height:22px;background:var(--panel-2);border-radius:6px;overflow:hidden;min-width:0}
  .brow .bar{height:100%;border-radius:6px;min-width:5px}
  .brow .blab{font-size:13px;font-weight:600;max-width:34%;overflow:hidden;
              text-overflow:ellipsis;white-space:nowrap;flex:none}
  .brow .n{width:38px;text-align:right;font-size:15px;font-weight:700;flex:none}
  .brow .clr{width:30px;height:30px;border-radius:8px;background:var(--panel-2);color:var(--muted);
             font-size:17px;line-height:1;flex:none}
  .tabs{display:flex;gap:6px;padding:10px 16px;border-bottom:1px solid var(--line)}
  .tab{flex:1;padding:8px;border-radius:9px;background:var(--panel-2);color:var(--muted);
       font-size:13px;font-weight:600;text-align:center}
  .tab.on{background:var(--lamp);color:#15120a}
  #boardEmpty{padding:26px 16px;text-align:center;color:var(--muted);font-size:13px;line-height:1.6}

  #toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%) translateY(12px);z-index:40;
         background:var(--panel-2);border:1px solid var(--line);border-radius:999px;padding:9px 16px;font-size:13px;
         opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;white-space:nowrap;max-width:86vw;overflow:hidden;text-overflow:ellipsis}
  #toast.show{opacity:1;transform:translateX(-50%)}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div id="gate">
  <div class="inner">
    <h1>Shuffle</h1>
    <p>Signs in to Drive, shuffles your folder, and plays it as a feed. Nothing is saved on this device — closing the tab ends the session.</p>
    <button class="primary" id="signin">Connect Drive</button>
    <div class="err" id="gateErr"></div>
  </div>
</div>

<div id="top">
  <div id="pos"></div>
  <button class="chip" id="reshuffle">Reshuffle</button>
</div>

<button id="like" aria-label="Like"><svg viewBox="0 0 24 24"><path d="M12 20s-7-4.6-7-9.3A4 4 0 0 1 12 8a4 4 0 0 1 7-2.7c0 4.7-7 14.7-7 14.7z"/></svg><span id="likeCnt"></span></button>

<div id="rank" aria-label="Ranking"><svg viewBox="0 0 24 24"><path d="M8 4h8v5a4 4 0 0 1-8 0z"/><path d="M8 5H5v2a3 3 0 0 0 3 3"/><path d="M16 5h3v2a3 3 0 0 1-3 3"/><path d="M12 13v4"/><path d="M9 20h6"/><path d="M10 17h4l1 3H9z"/></svg><b></b></div>

<div id="crank" aria-label="Category ranking"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="5.5"/><path d="M8.5 12.5 6 22l6-3 6 3-2.5-9.5"/></svg><b></b><span class="sep"></span><svg class="h" viewBox="0 0 24 24"><path d="M12 20s-7-4.6-7-9.3A4 4 0 0 1 12 8a4 4 0 0 1 7-2.7c0 4.7-7 14.7-7 14.7z"/></svg><i></i></div>

<div id="board" role="dialog" aria-modal="true" aria-label="Tally">
  <div id="boardPanel">
    <div class="boardHead">
      <h2>Tally</h2>
      <button class="close" id="closeBoard">Done</button>
    </div>
    <div class="tabs">
      <button class="tab on" data-mode="v">Videos</button>
      <button class="tab" data-mode="c">Categories</button>
    </div>
    <div id="rows"></div>
    <div id="boardEmpty">No likes yet. Tap the heart on a video to start counting.</div>
  </div>
</div>

<div id="feed" aria-label="Video feed"></div>
<div id="toast"></div>

<script src="https://accounts.google.com/gsi/client" async defer></script>
<script>
(() => {
"use strict";

/* ============================================================
   SET THESE TWO VALUES
   ============================================================ */
const CLIENT_ID = "912858917708-82lcot5nfb21r8lncfik2q0mvg6heovu.apps.googleusercontent.com";
const FOLDER_ID = "1XUdO_a3nphazi95miRNlcJvWIu0wyUSH";   // Drive folder ID
/* ============================================================ */

const SCOPE = "https://www.googleapis.com/auth/drive.readonly"
            + " https://www.googleapis.com/auth/drive.file";
const TALLY_FILE = "reel-tallies.json";
const $ = s => document.querySelector(s);
const feed = $("#feed"), gate = $("#gate");
let token = null, files = [], muted = true, tokenClient = null;
let current = 0;                 // index of the reel on screen
let counts = {};                 // {fileId: likes} — display only, never affects order
let folders = {};                // {folderId: name} — subfolders act as categories
let tallyId = null;              // Drive id of the tally file, once known
let queue = Promise.resolve();   // serialises downloads: one at a time

const ICON = {
  sound:'<svg viewBox="0 0 24 24"><path d="M11 5 6 9H3v6h3l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>',
  mute :'<svg viewBox="0 0 24 24"><path d="M11 5 6 9H3v6h3l5 4V5z"/><path d="m16 9 5 6M21 9l-5 6"/></svg>',
  next :'<svg viewBox="0 0 24 24"><path d="M12 5v14"/><path d="m6 13 6 6 6-6"/></svg>',
  play :'<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>',
  heart:'<svg viewBox="0 0 24 24"><path d="M12 20s-7-4.6-7-9.3A4 4 0 0 1 12 8a4 4 0 0 1 7-2.7c0 4.7-7 14.7-7 14.7z"/></svg>'
};
const fmtSize = b => !b ? "" : b >= 1073741824 ? (b/1073741824).toFixed(1)+" GB"
                  : b >= 1048576 ? Math.round(b/1048576)+" MB" : Math.round(b/1024)+" KB";

let toastTimer;
function toast(msg){
  const el = $("#toast"); el.textContent = msg; el.classList.add("show");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove("show"), 3000);
}
function fail(msg){ $("#gateErr").textContent = msg; $("#signin").disabled = false; $("#signin").textContent = "Try again"; }

/* ---------------- auth ---------------- */
$("#signin").onclick = () => {
  if (CLIENT_ID.startsWith("PASTE_")) return fail("No client ID set — paste yours into CLIENT_ID near the top of the file.");
  if (!window.google?.accounts?.oauth2) return fail("Google's sign-in script didn't load. Check the connection and reload.");
  $("#signin").disabled = true; $("#signin").textContent = "Waiting for Google…"; $("#gateErr").textContent = "";

  tokenClient = tokenClient || google.accounts.oauth2.initTokenClient({
    client_id: CLIENT_ID, scope: SCOPE,
    callback: res => { if (res.error) return fail("Sign-in was cancelled."); token = res.access_token; loadFiles(); },
    error_callback: () => fail("The sign-in window was blocked or closed. Allow pop-ups and try again.")
  });
  tokenClient.requestAccessToken({ prompt: "" });
};

async function api(url, signal){
  const r = await fetch(url, { headers: { Authorization: "Bearer " + token }, signal });
  if (r.status === 401){ token = null; throw new Error("Session expired — reload and sign in again."); }
  if (r.status === 403) throw new Error("Drive is rate-limiting. Wait a moment and retry.");
  if (!r.ok) throw new Error("Drive returned " + r.status + ".");
  return r;
}

/* ---------------- tallies ----------------
   Counts live in a JSON file in Drive, not in the browser, so they survive
   an incognito window closing. The drive.file scope reaches only files this
   app created, so it can keep this file and nothing else. */
async function authFetch(url, opts = {}){
  const r = await fetch(url, { ...opts, headers: { Authorization: "Bearer " + token, ...(opts.headers || {}) } });
  if (!r.ok) throw new Error("Drive returned " + r.status);
  return r;
}

async function loadTallies(){
  try{
    const q = encodeURIComponent(`name='${TALLY_FILE}' and trashed = false`);
    const d = await (await authFetch(`https://www.googleapis.com/drive/v3/files?q=${q}&fields=files(id)&pageSize=1`)).json();
    if (d.files && d.files.length){
      tallyId = d.files[0].id;
      const txt = await (await authFetch(`https://www.googleapis.com/drive/v3/files/${tallyId}?alt=media`)).text();
      const parsed = JSON.parse(txt);
      if (parsed && typeof parsed === "object") counts = parsed.counts || parsed;
    }
  }catch(e){
    counts = {};                      // start fresh rather than blocking the feed
  }
}

let saveTimer = null, saving = false, saveAgain = false;
function scheduleSave(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(saveTallies, 2500);   // batch a burst of taps into one write
}
async function saveTallies(){
  if (saving){ saveAgain = true; return; }
  saving = true;
  const body = JSON.stringify(counts);
  try{
    if (!tallyId){
      const meta = { name: TALLY_FILE, mimeType: "application/json" };
      const boundary = "rv" + Date.now();
      const payload =
        `--${boundary}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify(meta)}\r\n` +
        `--${boundary}\r\nContent-Type: application/json\r\n\r\n${body}\r\n--${boundary}--`;
      const d = await (await authFetch(
        "https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id",
        { method: "POST", headers: { "Content-Type": `multipart/related; boundary=${boundary}` }, body: payload }
      )).json();
      tallyId = d.id;
    } else {
      await authFetch(`https://www.googleapis.com/upload/drive/v3/files/${tallyId}?uploadType=media`,
        { method: "PATCH", headers: { "Content-Type": "application/json" }, body });
    }
  }catch(e){
    toast("Couldn't save likes — they'll retry");
    saveAgain = true;
  }finally{
    saving = false;
    if (saveAgain){ saveAgain = false; scheduleSave(); }
  }
}

/* A stable colour and glyph per video, worked out from its Drive id, so the
   tally shows recognisable marks without naming anything. */
function hashOf(str){
  let h = 2166136261;
  for (let i = 0; i < str.length; i++){ h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); }
  return h >>> 0;
}
const GLYPH = [
  '<circle cx="19" cy="19" r="8"/>',
  '<rect x="11" y="11" width="16" height="16" rx="3"/>',
  '<path d="M19 10 28 27H10z"/>',
  '<path d="M19 9 29 19 19 29 9 19z"/>',
  '<circle cx="19" cy="19" r="9" fill="none" stroke="#fff" stroke-width="4"/>',
  '<rect x="9" y="15" width="20" height="8" rx="4"/>',
  '<path d="M16 9h6v7h7v6h-7v7h-6v-7H9v-6h7z"/>',
  '<circle cx="14" cy="14" r="4.5"/><circle cx="24" cy="24" r="4.5"/><circle cx="24" cy="14" r="4.5"/>'
];
function avatar(id){
  const h = hashOf(id);
  const hue = h % 360;
  const g = GLYPH[(h >> 9) % GLYPH.length];
  return `<svg class="av" viewBox="0 0 38 38" aria-hidden="true">`
       + `<circle cx="19" cy="19" r="19" fill="hsl(${hue} 62% 46%)"/>`
       + `<g fill="#fff" opacity=".92">${g}</g></svg>`;
}
function hueOf(id){ return hashOf(id) % 360; }

/* ---------------- file list ---------------- */
/* Subfolders inside the main folder act as categories. Videos sitting
   loose in the main folder are simply uncategorised. */
async function loadFolders(){
  folders = {};
  if (!FOLDER_ID) return;
  const q = encodeURIComponent(
    `'${FOLDER_ID}' in parents and mimeType = 'application/vnd.google-apps.folder' and trashed = false`);
  const d = await (await api(
    `https://www.googleapis.com/drive/v3/files?q=${q}&fields=files(id,name)&pageSize=200`
    + `&supportsAllDrives=true&includeItemsFromAllDrives=true`)).json();
  (d.files || []).forEach(f => { folders[f.id] = f.name; });
}

async function loadFiles(){
  $("#signin").textContent = "Reading folder…";
  try{
    await loadFolders();

    const parts = ["mimeType contains 'video/'", "trashed = false"];
    if (FOLDER_ID){
      const ids = [FOLDER_ID, ...Object.keys(folders)];
      parts.push("(" + ids.map(id => `'${id}' in parents`).join(" or ") + ")");
    }
    const q = encodeURIComponent(parts.join(" and "));
    files = []; let pageToken = "";
    do{
      const url = `https://www.googleapis.com/drive/v3/files?q=${q}`
                + `&fields=nextPageToken,files(id,name,size,mimeType,starred,parents)&pageSize=200&orderBy=name`
                + `&supportsAllDrives=true&includeItemsFromAllDrives=true`
                + (pageToken ? `&pageToken=${pageToken}` : "");
      const data = await (await api(url)).json();
      files.push(...(data.files || []));
      pageToken = data.nextPageToken || "";
    } while (pageToken && files.length < 3000);

    if (!files.length) return fail(FOLDER_ID ? "No videos in that folder — check the folder ID." : "No videos found in this account.");

    files.forEach(f => { f.cat = folders[(f.parents || [])[0]] || ""; });

    $("#signin").textContent = "Reading tallies…";
    await loadTallies();
    const nStar = files.filter(f => f.starred).length;
    const nCat  = new Set(files.map(f => f.cat).filter(Boolean)).size;
    shuffle();
    gate.style.display = "none";
    feed.classList.add("on");
    $("#top").classList.add("on");
    render();
    setTimeout(() => toast(
      `${files.length} videos · ${nStar || "no"} starred · ${nCat || "no"} categories`), 600);
  }catch(e){ fail(e.message); }
}

function shuffle(){
  /* Starred videos are held back, then paced in: ten plain ones first, the
     first starred at position 11, then every third from there (14, 17, 20…).
     Like counts play no part in this — ordering is starred-only. */
  const pick = a => a.splice(Math.floor(Math.random() * a.length), 1)[0];
  const star  = files.filter(f => f.starred);
  const plain = files.filter(f => !f.starred);
  const out = [];
  let untilStar = 10;                 // ten plain, so #11 is the first starred

  while (star.length || plain.length){
    if (untilStar > 0 && plain.length){ out.push(pick(plain)); untilStar--; }
    else if (star.length){
      out.push(pick(star));
      untilStar = plain.length ? 2 : 0;   // two plain between starred = every 3rd
    }
    else out.push(pick(plain));
  }
  files = out;
}

$("#reshuffle").onclick = () => {
  [...feed.children].forEach(release);
  shuffle(); feed.scrollTop = 0; current = 0; render(); toast("Reshuffled");
};

/* ---------------- building a reel ---------------- */
function reelEl(f, n){
  const el = document.createElement("section");
  el.className = "reel";
  el.dataset.id = f.id;
  el.dataset.mime = f.mimeType || "video/mp4";
  el.dataset.size = f.size || "";
  el.innerHTML = `
    <div class="load">
      <div>
        <div class="bar"><i></i></div>
        <div class="pct">Waiting…</div>
        <button class="retry">Retry</button>
      </div>
    </div>
    <div class="shade"></div>
    <div class="meta"><div class="catlab" hidden></div><div class="name"></div></div>
    <div class="side">
      <button class="snd" aria-label="Sound">${muted ? ICON.mute : ICON.sound}</button>
      <button class="nxt" aria-label="Next">${ICON.next}</button>
    </div>
    <div class="pausepip"><div>${ICON.play}</div></div>
    <div class="scrub"><div class="track"><div class="fill"></div></div></div>`;

  el.querySelector(".name").textContent = f.name.replace(/\.[^.]+$/, "");
  if (f.cat){
    const c = el.querySelector(".catlab");
    c.textContent = f.cat;
    c.style.color = `hsl(${hueOf(f.cat)} 70% 68%)`;
    c.hidden = false;
  }

  el.addEventListener("click", ev => {
    if (ev.target.closest("button") || ev.target.closest(".scrub")) return;
    const v = el.querySelector("video");
    if (!el._url || !v){ want(); return; }
    if (!v.paused){ v.pause(); el.classList.add("paused"); return; }
    tryPlay(el).then(() => {
      const cur = el.querySelector("video");
      if (cur && cur.paused){ release(el); want(); }   // still stuck — reload it
    });
  });

  el.querySelector(".retry").onclick = ev => { ev.stopPropagation(); release(el); want(); };
  el.querySelector(".nxt").onclick = () => feed.scrollBy({ top: feed.clientHeight, behavior: "smooth" });
  el.querySelector(".snd").onclick = () => {
    muted = !muted;
    document.querySelectorAll(".reel video").forEach(x => x.muted = muted);
    document.querySelectorAll(".reel .snd").forEach(b => b.innerHTML = muted ? ICON.mute : ICON.sound);
  };

  const scrub = el.querySelector(".scrub");
  scrub.addEventListener("click", ev => {
    const v = el.querySelector("video");
    if (!v) return;
    const r = scrub.getBoundingClientRect();
    if (v.duration) v.currentTime = Math.min(1, Math.max(0, (ev.clientX - r.left) / r.width)) * v.duration;
  });
  return el;
}

/* Android hands out a small, device-wide pool of hardware decoders and
   reclaims them asynchronously. Minting a new <video> for every reel burns
   through that pool faster than it refills, and the next element comes back
   undecodable (error 4, readyState 0) no matter how good the file is. So we
   keep a couple of elements for the whole session and just swap the source. */
const pool = [];

function makeVideo(){
  const v = document.createElement("video");
  v.playsInline = true; v.loop = true; v.muted = muted; v.preload = "auto";
  v.setAttribute("playsinline", ""); v.setAttribute("webkit-playsinline", "");

  /* Listeners are bound once per element and find their reel at call time,
     since the element moves between reels. */
  v.addEventListener("error", () => {
    if (!v.getAttribute("src")) return;            // parked element, not a failure
    const el = v.closest(".reel");
    if (!el) return;
    const code = v.error?.code;
    if (code === 4 && el._bytes && el._try < labels(el).length - 1){
      el._try++;                                   // same bytes, different label
      attach(el);
      return;
    }
    /* Relabelling can't rescue bad bytes, so fetch the file again from
       scratch once before calling it a failure. */
    if (code === 4 && !el._redl){
      el._redl = 1;
      const expect = +el.dataset.size || 0;
      const got = el._size || 0;
      release(el);
      el._redl = 1;                                // release() clears flags
      load(el);
      if (expect && got < expect) toast("Re-downloading — the first copy came up short");
      return;
    }
    showError(el, code === 4
      ? `Can't decode: ${fmtSize(el._size || 0)} of ${fmtSize(+el.dataset.size || 0)}. Tap Retry.`
      : "Playback failed (media error " + (code ?? "?") + ") — tap Retry.");
  });

  v.addEventListener("timeupdate", () => {
    const el = v.closest(".reel");
    const fill = el?.querySelector(".fill");
    if (fill && v.duration) fill.style.width = (v.currentTime / v.duration * 100) + "%";
  });

  return v;
}

function takeVideo(){
  const v = pool.pop() || makeVideo();
  v.muted = muted;
  return v;
}

function parkVideo(v){
  v.pause();
  v.removeAttribute("src");
  v.load();                                        // drops the decoder, keeps the element
  v.remove();
  if (pool.length < 3) pool.push(v);
}

/* Chrome rejects a blob labelled video/quicktime even when the bytes inside
   are plain H.264 it can decode. Try the honest label, then mp4, then no
   label at all and let Chrome sniff the container. */
function labels(el){
  const m = el.dataset.mime || "";
  const out = [];
  if (m && m !== "video/quicktime") out.push(m);
  out.push("video/mp4", "");
  return out;
}

function attach(el){
  const type = labels(el)[el._try];
  let v = el.querySelector("video");
  if (!v){ v = takeVideo(); el.insertBefore(v, el.firstChild); }
  if (el._url) URL.revokeObjectURL(el._url);
  el._url = URL.createObjectURL(type ? new Blob(el._bytes, { type }) : new Blob(el._bytes));
  v.src = el._url;
  v.muted = muted;
  v.load();
  el.querySelector(".load").classList.add("hide");
  if (indexOf(el) === current) tryPlay(el);
}

/* One fixed heart that always refers to whatever reel is on screen, so it
   never gets torn down with a reel and can't disappear mid-scroll. */
/* Likes summed per category, from the folder each video sits in. */
function catTotals(){
  const sum = {};
  files.forEach(f => {
    const c = f.cat || "Uncategorised";
    sum[c] = (sum[c] || 0) + (counts[f.id] || 0);
  });
  return sum;
}

/* Where a category sits among the ten most-liked, or 0 if it isn't in them. */
function rankOfCat(name){
  if (!name) return 0;
  const sum = catTotals();
  const n = sum[name] || 0;
  if (!n) return 0;
  const better = Object.values(sum).filter(v => v > n).length;
  return better < 10 ? better + 1 : 0;
}

/* Where this video sits among the ten most-liked, or 0 if it isn't in them.
   Ties go to whoever was reached first, which is good enough for a badge. */
function rankOf(id){
  const n = counts[id] || 0;
  if (!n) return 0;
  const better = Object.keys(counts).filter(k => (counts[k] || 0) > n).length;
  return better < 10 ? better + 1 : 0;
}

function paintLike(){
  const f = files[current];
  const b = $("#like"), r = $("#rank");
  if (!f){ b.classList.remove("on"); r.classList.remove("on"); return; }
  const n = counts[f.id] || 0;
  b.classList.add("on");
  b.classList.toggle("has", n > 0);
  $("#likeCnt").textContent = n > 99 ? "99+" : n;

  const place = rankOf(f.id);
  r.classList.toggle("on", place > 0);
  r.classList.remove("r1", "r2", "r3");
  if (place){
    r.querySelector("b").textContent = place;
    if (place <= 3) r.classList.add("r" + place);   // gold, silver, bronze
  }

  const cr = $("#crank");
  const cname = f.cat || "Uncategorised";
  const cplace = rankOfCat(cname);
  cr.classList.toggle("on", cplace > 0);
  cr.classList.remove("r1", "r2", "r3");
  if (cplace){
    cr.querySelector("b").textContent = cplace;
    cr.querySelector("i").textContent = catTotals()[cname] || 0;
    if (cplace <= 3) cr.classList.add("r" + cplace);
  }
}

function bumpLike(by){
  const f = files[current];
  if (!f) return;
  const n = (counts[f.id] || 0) + by;
  if (n > 0) counts[f.id] = n; else delete counts[f.id];
  paintLike();
  const b = $("#like");
  b.classList.remove("pop"); void b.offsetWidth; b.classList.add("pop");
  scheduleSave();
}

/* Tap adds one; press and hold takes one back. */
(() => {
  const b = $("#like");
  let held = false, timer = null;
  const start = () => { held = false; timer = setTimeout(() => { held = true; bumpLike(-1); toast("Removed a like"); }, 550); };
  const end = ev => {
    clearTimeout(timer);
    /* Always cancel the default so a touch doesn't also fire synthetic mouse
       events, which would re-add the like a long press just removed. */
    if (ev.cancelable) ev.preventDefault();
    if (!held) bumpLike(1);
    held = false;
  };
  b.addEventListener("touchstart", start, { passive: true });
  b.addEventListener("touchend", end);
  b.addEventListener("mousedown", start);
  b.addEventListener("mouseup", end);
  b.addEventListener("contextmenu", e => e.preventDefault());
})();

/* ---------------- tally board ---------------- */
let boardMode = "v";                     // "v" videos, "c" categories

function boardRow(i, mark, label, n, top, hue, onTap){
  const row = document.createElement("div");
  row.className = "brow";
  row.innerHTML = `<div class="rank">${i + 1}</div>${mark}`
    + `<div class="barwrap"><div class="bar"></div></div><div class="n"></div>`;
  const bar = row.querySelector(".bar");
  bar.style.width = Math.max(4, Math.round(n / top * 100)) + "%";
  bar.style.background = `hsl(${hue} 62% 50%)`;
  row.querySelector(".n").textContent = n;
  if (label){
    const t = document.createElement("div");
    t.className = "blab"; t.textContent = label;
    row.insertBefore(t, row.querySelector(".barwrap"));
  }
  if (onTap) row.onclick = onTap;
  return row;
}

function renderVideos(){
  const rows = $("#rows");
  const ranked = files.map(f => ({ f, n: counts[f.id] || 0 }))
                      .filter(x => x.n > 0)
                      .sort((a, b) => b.n - a.n);
  $("#boardEmpty").textContent = "No likes yet. Tap the heart on a video to start counting.";
  $("#boardEmpty").style.display = ranked.length ? "none" : "block";
  rows.innerHTML = "";
  const top = ranked[0]?.n || 1;

  ranked.forEach((x, i) => {
    const row = boardRow(i, avatar(x.f.id), "", x.n, top, hueOf(x.f.id), () => {
      const at = files.indexOf(x.f);
      if (at >= 0){ closeBoard(); feed.scrollTo({ top: at * feed.clientHeight }); }
    });
    const clr = document.createElement("button");
    clr.className = "clr"; clr.setAttribute("aria-label", "Clear"); clr.innerHTML = "&minus;";
    clr.onclick = ev => { ev.stopPropagation(); delete counts[x.f.id]; scheduleSave(); paintLike(); openBoard(); };
    row.appendChild(clr);
    rows.appendChild(row);
  });
}

function renderCategories(){
  const rows = $("#rows");
  const sum = catTotals();
  const ranked = Object.entries(sum).map(([name, n]) => ({ name, n }))
                       .filter(x => x.n > 0)
                       .sort((a, b) => b.n - a.n);

  $("#boardEmpty").textContent = Object.keys(folders).length
    ? "No likes in any category yet."
    : "No subfolders found. Make folders inside your main Drive folder and move videos into them.";
  $("#boardEmpty").style.display = ranked.length ? "none" : "block";
  rows.innerHTML = "";
  const top = ranked[0]?.n || 1;

  ranked.forEach((x, i) => {
    const hue = hueOf(x.name);
    const dot = `<svg class="av" viewBox="0 0 38 38" aria-hidden="true">`
              + `<circle cx="19" cy="19" r="19" fill="hsl(${hue} 62% 46%)"/></svg>`;
    rows.appendChild(boardRow(i, dot, x.name, x.n, top, hue, null));
  });
}

function openBoard(){
  document.querySelectorAll(".tab").forEach(t => t.classList.toggle("on", t.dataset.mode === boardMode));
  (boardMode === "c" ? renderCategories : renderVideos)();
  $("#board").classList.add("show");
}
function closeBoard(){ $("#board").classList.remove("show"); }
$("#rank").onclick = openBoard;
$("#pos").onclick = openBoard;        // the counter doubles as the way in
$("#closeBoard").onclick = closeBoard;
$("#board").addEventListener("click", e => { if (e.target.id === "board") closeBoard(); });
document.querySelectorAll(".tab").forEach(t => {
  t.onclick = () => { boardMode = t.dataset.mode; openBoard(); };
});

function showError(el, msg){
  const l = el.querySelector(".load");
  l.classList.remove("hide"); l.classList.add("err");
  l.querySelector(".pct").textContent = msg;
}

/* ---------------- load / release ---------------- */
async function load(el, attempt = 0){
  if (el._url || el._ctrl) return;                 // already loaded or in flight
  if (!token){ showError(el, "Session expired — reload."); return; }

  const ctrl = new AbortController();
  el._ctrl = ctrl;
  const l  = el.querySelector(".load");
  const bar = l.querySelector(".bar i"), pct = l.querySelector(".pct");
  l.classList.remove("hide", "err"); bar.style.width = "0";
  pct.textContent = attempt ? `Retrying (${attempt + 1})…` : "Loading…";

  try{
    const r = await api(`https://www.googleapis.com/drive/v3/files/${el.dataset.id}?alt=media&supportsAllDrives=true`, ctrl.signal);
    const total = +r.headers.get("content-length") || 0;
    const reader = r.body.getReader();
    const chunks = []; let got = 0;
    for(;;){
      const { done, value } = await reader.read();
      if (done) break;
      chunks.push(value); got += value.length;
      if (total){ const p = Math.round(got / total * 100); bar.style.width = p + "%"; pct.textContent = p + "%"; }
      else pct.textContent = fmtSize(got);
    }
    if (ctrl.signal.aborted) return;

    /* A stream that closes early ends the loop cleanly with partial data, and
       a truncated MP4 is an undecodable MP4. Drive doesn't always send
       content-length, so trust the size from the file listing first. */
    const want_ = +el.dataset.size || total;
    if (want_ && got < want_){
      el._ctrl = null;
      if (attempt < 3) return load(el, attempt + 1);
      showError(el, `Download cut short — got ${fmtSize(got)} of ${fmtSize(want_)}. Tap Retry.`);
      return;
    }

    el._bytes = chunks;
    el._size = got;
    el._try = 0;
    attach(el);
  }catch(e){
    if (e.name === "AbortError") return;           // we cancelled it on purpose
    el._ctrl = null;
    if (attempt < 2 && (e.name === "TypeError" || /network|fetch/i.test(e.message || ""))){
      return load(el, attempt + 1);                // transient connection drop
    }
    showError(el, e.message || "Couldn't load this one.");
  }finally{
    if (el._ctrl === ctrl) el._ctrl = null;
  }
}

function release(el){
  el._ctrl?.abort();
  el._ctrl = null;

  /* Remove the <video> outright. Chrome caps how many media elements a page
     may hold (roughly 75 on Android); with a large library, keeping one per
     reel pushes past that and the extras silently refuse to load. Only the
     reels in play own an element. */
  const v = el.querySelector("video");
  if (v) parkVideo(v);

  if (el._url){ URL.revokeObjectURL(el._url); el._url = null; }
  el._bytes = null; el._try = 0; el._size = 0; el._redl = 0;

  const l = el.querySelector(".load");
  l.classList.remove("hide", "err");
  l.querySelector(".bar i").style.width = "0";
  l.querySelector(".pct").textContent = "Waiting…";
  el.classList.remove("paused");
}

async function tryPlay(el, attempt = 0){
  const v = el.querySelector("video");
  if (!v) return;
  if (indexOf(el) !== current) return;            // it's not on screen any more
  try{
    await v.play();
    el.classList.remove("paused");
    return;
  }catch(e){
    /* AbortError = something paused it mid-request; NotAllowedError = autoplay refused.
       Both are recoverable: wait a beat, go muted, and try again. */
    if ((e.name === "AbortError" || e.name === "NotAllowedError") && attempt < 3){
      v.muted = true;
      await new Promise(r => setTimeout(r, 200));
      return tryPlay(el, attempt + 1);
    }
    el.classList.add("paused");
    showError(el, `Wouldn't play: ${e.name}. ready ${v.readyState}, `
      + `err ${v.error?.code ?? "none"}, ${fmtSize(el._size || 0)} downloaded`);
  }
}

const indexOf = el => [...feed.children].indexOf(el);

/* Keep exactly two videos alive: the current one and the next.
   Everything else is aborted and freed, so decoders never pile up. */
function want(){
  const kids = [...feed.children];
  kids.forEach((el, n) => {
    const keep = (n === current || n === current + 1);
    if (!keep && (el._url || el._ctrl || el._bytes)) release(el);
    if (n !== current) el.querySelector("video")?.pause();
  });
  // download current first, then the next one — never in parallel
  /* Guard each queued load: by the time it runs, the feed may have moved
     on, and loading a released reel recreates the element churn. */
  const near = el => { const n = indexOf(el); return n === current || n === current + 1; };
  queue = queue.then(() => { const el = kids[current];     if (el && near(el)) return load(el); })
               .then(() => { const el = kids[current + 1]; if (el && near(el)) return load(el); })
               .catch(() => {});
  const cur = kids[current];
  if (cur?._url) tryPlay(cur);
}

function render(){
  feed.innerHTML = "";
  files.forEach((f, n) => feed.appendChild(reelEl(f, n)));
  current = 0;
  updatePos(0);
  want();
}

function updatePos(i){
  $("#pos").textContent = `${Math.min(i + 1, files.length)} / ${files.length} \u00b7 v20`;
  paintLike();
}

/* React only once scrolling settles, so a fast swipe-through
   doesn't kick off a download for every reel it passes. */
let settle;
feed.addEventListener("scroll", () => {
  const i = Math.round(feed.scrollTop / feed.clientHeight);
  if (i !== current){ current = i; updatePos(i); }
  clearTimeout(settle);
  settle = setTimeout(want, 160);   // act only once the snap has settled
});

/* ---------------- keyboard ---------------- */
addEventListener("keydown", e => {
  if (!feed.classList.contains("on")) return;
  const h = feed.clientHeight;
  if (e.key === "ArrowDown" || e.key === "PageDown"){ e.preventDefault(); feed.scrollBy({ top:h, behavior:"smooth" }); }
  if (e.key === "ArrowUp"   || e.key === "PageUp"  ){ e.preventDefault(); feed.scrollBy({ top:-h, behavior:"smooth" }); }
  if (e.key === " "){ e.preventDefault(); [...feed.children][current]?.click(); }
});
})();
</script>
